# The full replication: the paper's 2 s protocol on a fine mesh, i.e. the counterpart
# of quick.yaml. These are the Config defaults spelled out -- only the fields quick.yaml
# coarsens are repeated, so nothing else can drift out of sync with ../simulation.py.
# Running it is the same as running simulation.py with no --config-name.
# Run: uv run scripts/literature_replications/sala_1990/simulation.py --config-name accurate
defaults:
  - sala
  - _self_

mesh_size: "2 um"
end_time: "2 s"
record_interval: "1 ms"
