# Diffusion and synaptic sinks only: no ECM buffer, no mechanics -- the cheap baseline
# the sweeps and mechanics.yaml are compared against. These are the Config defaults
# spelled out (only the switches mechanics.yaml flips are repeated, so nothing else can
# drift out of sync with ../simulation.py). Running it is the same as running
# simulation.py with no --config-name, results/tissue_kinetics_<timestamp>.
# Run: uv run scripts/ongoing_work/tissue_kinetics/simulation.py --config-name diffusion_only
defaults:
  - tissue_kinetics
  - _self_

ecm:
  enabled: false
mechanics:
  enabled: false
geometry:
  ecs_ratio: 0.1
