# Fewer action potentials, solitary synapse: single_buffer_sweep's placements at 1 mM
# (uniform, on-target, off-target neighbour, sigma 2 um) with 1 and 2 pulses, 10 ms
# apart. Reference: fewap_reference_sweep. 2 x 4 targets x 3 placements = 24 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name fewap_buffer_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8

result_root: results/fewap-buffer

base:
  ecm:
    enabled: true
    ecm_total: "1 mM"
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"

sweep:
  synapse.pulse_times:
    - ["100 ms"]
    - ["100 ms", "110 ms"]
  "synapse.active, ecm.local_width, ecm.local_target":
    - [[28], null, null]
    - [[28], "2.0 um", [28]]
    - [[28], "2.0 um", [4]]
    - [[49], null, null]
    - [[49], "2.0 um", [49]]
    - [[49], "2.0 um", [5]]
    - [[3], null, null]
    - [[3], "2.0 um", [3]]
    - [[3], "2.0 um", [51]]
    - [[39], null, null]
    - [[39], "2.0 um", [39]]
    - [[39], "2.0 um", [30]]
seeds: 1
