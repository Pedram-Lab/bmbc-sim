# STALE: the synapse indices in this file were picked by select_targets.py on the old
# shrunken-cell geometry (400 synapses). On the rounded-Voronoi and tube meshes they name
# other spots; rerun the reference and select_targets.py before using this config.
# Dose-response study at ecs_ratio 0.25 (the 0.1 study is dose_core_sweep.yaml).
# The cells of one geometry seed are the same at every ecs_ratio, so the synapse indices
# (and the buffered half from select_targets.py on the 0.1 reference) denote the same
# membrane spots as at 0.1. Trimmed to what mattered at 0.1: no 0.1 mM dose, no sigma 0.5 um.
# Row 1 is the no-buffer reference. 1 + 4 doses x (uniform, all, half) = 13 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name dose_core_ecs25_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8

base:
  geometry:
    ecs_ratio: 0.25
  ecm:
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"

result_root: results/dose-core-ecs25

sweep:
  "ecm.enabled, ecm.ecm_total, ecm.local_width, ecm.local_target":
    - [false, "1 mM", null, null]   # reference (ecm_total ignored)
    - [true, "0.3 mM", null, null]
    - [true, "0.3 mM", "1 um", null]
    - [true, "0.3 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - [true, "1 mM", null, null]
    - [true, "1 mM", "1 um", null]
    - [true, "1 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - [true, "3 mM", null, null]
    - [true, "3 mM", "1 um", null]
    - [true, "3 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - [true, "10 mM", null, null]
    - [true, "10 mM", "1 um", null]
    - [true, "10 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
seeds: 1
