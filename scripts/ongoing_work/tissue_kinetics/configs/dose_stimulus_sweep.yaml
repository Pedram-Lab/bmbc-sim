# Dose-response study, step 3c: sub-saturating stimulus (a single pulse, so the
# synapse does not sit at the depletion floor). Reference: dose_reference_sweep's
# 1-pulse run. 2 x 2 = 4 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name dose_stimulus_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 16   # 4 threads each on the 72-core box; LSF is not reachable from here

base:
  time_step: "0.5 ms"
  record_interval_factor: 4   # 2 ms records
  ecm:
    enabled: true
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"
  synapse:
    pulse_times: ["100 ms"]

result_root: results/dose-stimulus-sweep

sweep:
  ecm.ecm_total: ["0.3 mM", "3 mM"]
  "ecm.local_width, ecm.local_target":
    - [null, null]
    - ["1 um", LOCAL_TARGET_PLACEHOLDER]
seeds: 1
