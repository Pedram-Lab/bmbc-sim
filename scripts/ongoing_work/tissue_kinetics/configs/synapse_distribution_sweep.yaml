# Synapse-distribution sweep (replaces synapse_distribution.py).
# One ECS ratio, many seeds: this measures the spread across random synapse
# placements rather than the response to a parameter. Kept as a one-value sweep axis
# so the ECS ratio still shows up in the output path.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name synapse_distribution_sweep
defaults:
  - cluster: local    # override on the CLI with cluster=janelia
  - _self_            # this file's own values win over the group above

result_root: results/synapse-distribution-sweep

cluster:
  n_workers: 10    # 100 runs; don't start them all at once

# Cartesian product of these axes x seeds. Keys are dotted paths into the groups;
# values are validated per Config field.
sweep:
  geometry.ecs_ratio: [0.04, 0.11, 0.19]    # was the --ecs flag; add values to compare ratios
seeds: 10
