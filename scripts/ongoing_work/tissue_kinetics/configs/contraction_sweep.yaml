# Contraction-force sweep (replaces contraction_force_sweep.py).
# Mechanics on, ECM buffer fixed at the Kd = 1.3 mM operating point
# (ECM_total = 2 mM); scan the Ca-driven contraction stress and the ECS ratio.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name contraction_sweep
defaults:
  - cluster/local@cluster    # swap for cluster/janelia@cluster on the cluster
  - _self_

result_root: results/contraction-force-sweep

# Every non-swept parameter (validated against the tissue_kinetics Config).
base:
  simulation_name: tissue_kinetics
  mechanics:
    enabled: true
  ecm:
    ecm_total: "2.0 mmol / L"
    ecm_kr: "1000 / s"
    ecm_kf: "769.23 L / (mmol s)"   # Kd = ecm_kr / ecm_kf = 1.3 mmol/L

# Cartesian product of these axes x seeds. Keys are dotted paths into the groups;
# values are validated per Config field.
sweep:
  mechanics.ecm_ca_coupling: ["0 kPa L / mmol", "0.03 kPa L / mmol", "0.1 kPa L / mmol"]
  geometry.ecs_ratio: [0.04, 0.19]
seeds: 10
