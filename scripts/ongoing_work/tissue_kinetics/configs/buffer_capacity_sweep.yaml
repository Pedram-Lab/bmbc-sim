# Buffer-capacity sweep (replaces buffer_capacity_sweep.py).
# ECM buffer on at ECM_total = 2 mM with the on-rate fixed; scan the dissociation
# constant Kd over two decades (so the off-rate kr = ecm_kf * Kd follows) and the ECS
# ratio. The old driver pinned kr instead of ecm_kf, against what its docstring said.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name buffer_capacity_sweep
defaults:
  - cluster: local    # override on the CLI with cluster=janelia
  - _self_            # this file's own values win over the group above

result_root: results/buffer-capacity-sweep

# Non-swept parameters; unlisted fields fall back to the Config defaults in ../simulation.py.
base:
  ecm:
    enabled: true
    ecm_total: "2.0 mM"
    # Fixed on-rate, chosen so that the Kd = 1.3 mM point below keeps the
    # kr = 1000 / s operating point that contraction_sweep builds on.
    ecm_kf: "769.23 / (mM s)"

# Cartesian product of these axes x seeds. Keys are dotted paths into the groups;
# values are validated per Config field.
sweep:
  ecm.ecm_kd: ["0.1 mM", "0.3 mM", "0.7 mM", "1.3 mM", "3.0 mM", "10.0 mM"]
  geometry.ecs_ratio: [0.04, 0.19]
seeds: 10
