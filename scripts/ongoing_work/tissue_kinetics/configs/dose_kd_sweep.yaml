# Dose-response study, step 3b: affinity. kf fixed at 1e5 /(mM s), Kd around the
# resting Ca (plus 0.01 mM: a buffer that is saturated at rest and does nothing).
# 4 x 2 x 2 = 16 runs (4 duplicate dose_core_sweep).
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name dose_kd_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 16   # 4 threads each on the 72-core box; LSF is not reachable from here

base:
  time_step: "0.5 ms"
  record_interval_factor: 4   # 2 ms records
  ecm:
    enabled: true
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"

result_root: results/dose-kd-sweep

sweep:
  ecm.ecm_kd: ["0.01 mM", "0.3 mM", "1 mM", "3 mM"]
  ecm.ecm_total: ["0.3 mM", "3 mM"]
  "ecm.local_width, ecm.local_target":
    - [null, null]
    - ["1 um", LOCAL_TARGET_PLACEHOLDER]
seeds: 1
