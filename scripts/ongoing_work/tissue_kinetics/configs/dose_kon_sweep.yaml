# Dose-response study, step 3a: does the local-vs-uniform difference survive the
# buffer on-rate? Kd fixed at 1 mM, kf over 8 decades, sigma 1 um, two doses,
# uniform vs half-buffered. 9 x 2 x 2 = 36 runs (4 duplicate dose_core_sweep).
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name dose_kon_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 24   # 4 threads each on the 72-core box, runs use ~1 core on average; LSF is not reachable from here

base:
  time_step: "0.5 ms"
  record_interval_factor: 4   # 2 ms records
  ecm:
    enabled: true
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"

result_root: results/dose-kon-sweep

sweep:
  ecm.ecm_kf: ["1e-2 / (mM s)", "1e-1 / (mM s)", "1e0 / (mM s)", "1e1 / (mM s)", "1e2 / (mM s)", "1e3 / (mM s)", "1e4 / (mM s)", "1e5 / (mM s)", "1e6 / (mM s)"]
  ecm.ecm_total: ["0.3 mM", "3 mM"]
  "ecm.local_width, ecm.local_target":
    - [null, null]
    - ["1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
seeds: 1
