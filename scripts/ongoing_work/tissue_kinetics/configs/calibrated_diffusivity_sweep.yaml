# Calibrated-diffusivity sweep.
# ECM buffer on; scan the free ECS diffusivities that make the *buffered* front advance
# like unbuffered diffusion at 0.7 um2 / ms, as measured by
# scripts/ongoing_work/buffered_diffusion/invert_diffusivity.py. One value per buffer
# state that script can invert, plus 0.7 itself (the Config default baseline, i.e. the
# uncalibrated buffered run):
#
#   baseline      -- no calibration; the buffer slows this one down
#   saturated     -- buffer half-bound at Kd, Ca flowing in
#   replenishment -- buffer half-bound at Kd, Ca drawn out: matches this sim
#                    (ECS starts at ca_ecs in equilibrium, synapses drain it)
#   depleted      -- buffer starts fully unbound, Ca flowing in
#
# CAVEAT: This needs to be run at the same concentration / kd values than the
# invert_diffusivity.py script.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name calibrated_diffusivity_sweep
defaults:
  - cluster: janelia    # override on the CLI with cluster=local
  - _self_              # this file's own values win over the group above

result_root: results/calibrated-diffusivity-sweep

# LSF: one simulation per job, 4 cores each, all 80 submitted at once (LSF decides how
# many run at a time). Add "n_workers: 20" to cap the jobs in flight instead.
cluster:
  n_threads_per_worker: 4
  extra:
    walltime: "04:00"

# Non-swept parameters; unlisted fields fall back to the Config defaults in
# ../simulation.py. ecm.enabled is set by the zipped axis below; the buffer's
# kd/kf/total are the defaults, deliberately untouched (see the caveat above).
base:
  diffusion:
    # Pin the outer-boundary permeability to the value the tortuosity formula
    # gives at the 0.7 um2/ms baseline, so it doesn't move with the swept
    # diffusion.diffusivity_ecs below (0.7 / tortuosity^2 / l_char, l_char =
    # max(box_size_x/y/z)/2 = 10 um).
    boundary_permeability: "0.02734375 um / ms"

# Cartesian product of these axes x seeds. Keys are dotted paths into the groups;
# values are validated per Config field. A comma-joined key zips its axes: each value
# is one [diffusivity, enabled] pair, swept together -- 0.7 is the unbuffered reference,
# the calibrated values run with the buffer on.
# replenishment: 0.9284 um²/ms, saturated: 0.8451 um²/ms -> harmonic mean:  0.8847 um²/ms
sweep:
  "diffusion.diffusivity_ecs, ecm.enabled":
    - ["0.7 um2 / ms", false]
    - ["0.8847 um2 / ms", true]
  geometry.ecs_ratio: [0.04, 0.19]
seeds: 10
