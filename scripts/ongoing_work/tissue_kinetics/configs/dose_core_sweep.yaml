# STALE: the synapse indices in this file were picked by select_targets.py on the old
# shrunken-cell geometry (400 synapses). On the rounded-Voronoi and tube meshes they name
# other spots; rerun the reference and select_targets.py before using this config.
# Dose-response study, step 1: the same total buffer amount (ecm_total = ECS mean)
# placed uniformly, as Gaussians (sigma = local_width) on every active synapse, or on
# half of them (local_target from select_targets.py on the reference run: it holds
# exactly one restricted and one connected evaluation synapse). Compare against
# dose_reference_sweep. 5 doses x (1 uniform + 2 sigma x 2 placements) = 25 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name dose_core_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8   # runs in flight at any time (user preference; the box has 72 cores); LSF is not reachable from here

base:
  ecm:
    enabled: true
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"

result_root: results/dose-core-sweep

sweep:
  ecm.ecm_total: ["0.1 mM", "0.3 mM", "1 mM", "3 mM", "10 mM"]
  "ecm.local_width, ecm.local_target":
    - [null, null]           # uniform
    - ["0.5 um", null]       # all synapses buffered
    - ["1 um", null]
    - ["0.5 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
seeds: 1
