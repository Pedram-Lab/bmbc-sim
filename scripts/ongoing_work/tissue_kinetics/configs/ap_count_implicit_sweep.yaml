# No-buffer reference, all synapses firing, 1-10 action potentials 10 ms apart from 100 ms
# (default protocol, 0.5 s end), rerun with ProportionalFlux implicit in the diffusion
# half-steps. Same protocol as dose_reference (1, 5), fewap_reference (2) and
# ap_count_reference (3-10), which used the explicit sink. 10 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name ap_count_implicit_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 10

result_root: results/ap-count-implicit

sweep:
  synapse.pulse_times:
    - ["100 ms"]
    - ["100 ms", "110 ms"]
    - ["100 ms", "110 ms", "120 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms", "170 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms", "170 ms", "180 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms", "170 ms", "180 ms", "190 ms"]
seeds: 1
