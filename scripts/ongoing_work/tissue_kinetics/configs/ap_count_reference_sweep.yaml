# No-buffer reference, all synapses firing, 3-10 action potentials 10 ms apart from
# 100 ms (default protocol, 0.5 s end): the stimulus axis without ECM. 1 and 5 pulses are
# in dose_reference_sweep, 2 in fewap_reference_sweep. 7 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name ap_count_reference_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8

result_root: results/ap-count-reference

sweep:
  synapse.pulse_times:
    - ["100 ms", "110 ms", "120 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms", "170 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms", "170 ms", "180 ms"]
    - ["100 ms", "110 ms", "120 ms", "130 ms", "140 ms", "150 ms", "160 ms", "170 ms", "180 ms", "190 ms"]
seeds: 1
