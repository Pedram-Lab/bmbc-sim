# dose_core_sweep with 2 action potentials 10 ms apart. The 0.3 and 3 mM uniform and
# half-sigma-1 runs are in fewap_crowd_sweep; reference: fewap_reference_sweep.
# 25 - 4 = 21 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name dose_core_2p_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 16   # x 4 NGSolve threads (n_threads default)

base:
  ecm:
    enabled: true
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"
  synapse:
    pulse_times: ["100 ms", "110 ms"]

result_root: results/dose-core-2p

sweep:
  "ecm.ecm_total, ecm.local_width, ecm.local_target":
    - ["0.1 mM", null, null]
    - ["0.1 mM", "0.5 um", null]
    - ["0.1 mM", "1 um", null]
    - ["0.1 mM", "0.5 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["0.1 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["0.3 mM", "0.5 um", null]
    - ["0.3 mM", "1 um", null]
    - ["0.3 mM", "0.5 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["1 mM", null, null]
    - ["1 mM", "0.5 um", null]
    - ["1 mM", "1 um", null]
    - ["1 mM", "0.5 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["1 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["3 mM", "0.5 um", null]
    - ["3 mM", "1 um", null]
    - ["3 mM", "0.5 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["10 mM", null, null]
    - ["10 mM", "0.5 um", null]
    - ["10 mM", "1 um", null]
    - ["10 mM", "0.5 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
    - ["10 mM", "1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
seeds: 1
