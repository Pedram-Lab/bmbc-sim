# Fewer action potentials, all synapses firing: dose_stimulus_sweep with 2 pulses
# 10 ms apart (dose_stimulus_sweep has the 1-pulse runs). Reference:
# fewap_reference_sweep. 2 x 2 = 4 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name fewap_crowd_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8   # runs in flight at any time (user preference; the box has 72 cores); LSF is not reachable from here

base:
  ecm:
    enabled: true
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"
  synapse:
    pulse_times: ["100 ms", "110 ms"]

result_root: results/fewap-crowd

sweep:
  ecm.ecm_total: ["0.3 mM", "3 mM"]
  "ecm.local_width, ecm.local_target":
    - [null, null]
    - ["1 um", [0, 1, 2, 3, 7, 9, 11, 14, 16, 20, 21, 25, 26, 27, 28, 30, 32, 34, 36, 38, 43, 44, 45, 47, 48, 50, 55, 56, 58, 59]]
seeds: 1
