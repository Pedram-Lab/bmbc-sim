# Solitary synapse, buffer placement at ecs_ratio 0.19 (single_buffer_sweep.yaml at 0.1).
# 1 mM only (0.3 mM was far below any threshold at 0.1): uniform, on-target and
# off-target neighbour at sigma = footprint 1/e radius of single_reference_ecs19
# (filled in by the run chain), plus sigma = 1 um on-target. 4 targets x 4 = 16 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name single_buffer_ecs19_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8

base:
  geometry:
    ecs_ratio: 0.19
  ecm:
    enabled: true
    ecm_total: "1 mM"
    ecm_kd: "1 mM"
    ecm_kf: "1e5 / (mM s)"

result_root: results/single-buffer-ecs19

sweep:
  "synapse.active, ecm.local_width, ecm.local_target":
    # target 28 (restricted at 0.1); off-target neighbour 4
    - [[28], null, null]
    - [[28], "1.5 um", [28]]
    - [[28], "1.5 um", [4]]
    - [[28], "1 um", [28]]
    # target 49 (restricted at 0.1); neighbour 5
    - [[49], null, null]
    - [[49], "1.5 um", [49]]
    - [[49], "1.5 um", [5]]
    - [[49], "1 um", [49]]
    # target 3 (connected at 0.1); neighbour 51
    - [[3], null, null]
    - [[3], "1.5 um", [3]]
    - [[3], "1.5 um", [51]]
    - [[3], "1 um", [3]]
    # target 39 (connected at 0.1); neighbour 30
    - [[39], null, null]
    - [[39], "1.5 um", [39]]
    - [[39], "1.5 um", [30]]
    - [[39], "1 um", [39]]
seeds: 1
