# STALE: the synapse indices in this file were picked by select_targets.py on the old
# shrunken-cell geometry (400 synapses). On the rounded-Voronoi and tube meshes they name
# other spots; rerun the reference and select_targets.py before using this config.
# Solitary-synapse reference at ecs_ratio 0.25 (single_reference_sweep.yaml at 0.1): no
# buffer, one active synapse per run. footprint.py on these runs gives the buffer width
# for single_buffer_ecs25.yaml. 4 runs.
# Run: uv run scripts/ongoing_work/tissue_kinetics/sweep.py --config-name single_reference_ecs25_sweep
defaults:
  - cluster: local
  - _self_

cluster:
  n_workers: 8

base:
  geometry:
    ecs_ratio: 0.25

result_root: results/single-reference-ecs25

sweep:
  synapse.active: [[28], [49], [3], [39]]
seeds: 1
